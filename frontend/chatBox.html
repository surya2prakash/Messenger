<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatBox</title>
    <link rel="stylesheet" href="chatBox.css">
    <!-- remix-icon cdn -->
    <link
    href="https://cdn.jsdelivr.net/npm/remixicon@4.7.0/fonts/remixicon.css"
    rel="stylesheet"
    />
    <!-- send icon cdn -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=send" />
    <!-- edit icon cdn -->
   <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=edit" />
   <!-- new group -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=group_add" />
</head>
<body>
  
    <div class="wrapper ">
           <section class="aside-section">
            <nav class="search-container">
              <form class="side-bar-search">
                  <input type="text" placeholder="search" id="side-bar-search-input"> 
                  </form>
                                   
            </nav>
            <div class="all-List-Container">
                 <div class="all-List">
                       
                 </div>
                 <div>
                <div class="aside-edit-icon"><i class="ri-pencil-fill"></i>
                                          </div> 
                      <div class="edit-options-container hide">                       
                      <div class="create-group"><span class="material-symbols-outlined">
                              group_add</span>
                            New Group</div>
                      <div class="show-my-profile"><i class="ri-user-line"></i>Profile</div>
                      <div class="logout-icon">Log-Out</div>
                      </div>  
                      </div>  
                      
                      </div>
           </section>
           <section class="main-section hide">
            <nav class="nav-bar">
                <div class="profile-container">
                   <div class="profile-image"><img src="" alt="NO" class="profile--image"></div>
                   <div class="profile-name"></div>
                 </div>
                   <div class="right-icons">
                   <div class="add_group_icon "><i class="ri-user-add-line"></i></div>
                   <div class="dot-icon"><i class="ri-more-2-fill"></i></div>
                    <div class="close-tab" ><i class="ri-close-line"></i></div>
                  </div> 
                 
                  
                   <div class="edit-container hide">
                               <div class="close-icon"><i class="ri-close-line"></i></div>
                        
                              <div class="edit-profile ">
                                   <div class="edit-img">
                                <img src="" alt="no" id="edit-profile">
                                </div>
                                <div class="edit-main-container">
                                    <div class="edit-name-container">   
                                           <div class="edit-name" >name</div>
                                          <button class="btn-edit"><i class="ri-edit-2-fill"></i></button>
                                          </div> 
                                  <form class="edit-form-name hide">
                                      <input type="text" placeholder="edit name" id="edit_name_input">
                                        <button class="btn-save">Save</button>
                                  </form>
                                </div>
                                         <div class="group-users-list"></div>
                              </div>
                              <div class="delete-or-leave">
                                     <button class="delete-account hide">delete Group</button>
                                        <button class="leave-account">Leave Group</button> 
                               </div> 

                          
                   </div>
                   
                 <div class="user-for-add-container hide">
                     <div class="close-icon-add-user"><i class="ri-close-fill"></i></div>
                   <div class="show-user-for-add">
                        
                   </div>
                   </div>
            </nav>
            <div class="main-container">
                   <div class="show-messages"></div>
                   <div class="massage-input">
                      <form class="input-message">
                            <input type="text" placeholder="type-message" id="input-message">
                           
                              <button class="send-text  ">Send</button>
                             
                             
                      </form>
                   </div>
            </div>
           </section>
           <!-- user ke khud ka profile show kren ke liye -->
           <section class="show-Profile-section hide">
                            <div class="myprofile-close"><i class="ri-close-fill"></i></div>
                                 <div class="myprofile-image">
                                   <img src="" alt="no" id="myprofile-image">
                                   </div>
                           
                            <div class="edit-myprofile-name ">
                            <div class="myprofile-name">name</div>
                            <div class="myProfile-name-edit-btn"><i class="ri-edit-2-line"></i></div>
                            </div>
                             
                                    <div class="myprofile_email"></div>
                               <div class="profile_group_container">
                                   <div class="group-in">Joined Groups :</div>
                                   <div class="profile_group_list"></div>
                               </div>
                            
                                 <form class="myprofile-update-name hide ">
                                      <input type="text" placeholder="update name">
                                      <button>update</button>
                                 </form>  
                           

                           
                                   <button class="myprofile-delete">Delete Account</button>
                            
                              

                      
           </section>

           <section class="create-group-container hide">
               <div class="close_create_container"><i class="ri-close-fill"></i></div>
                       <div class="create-groups">Create New Group</div>
                      <form class="group_form">
                            
                             <input type="text" placeholder="enter name" id="group_name">
                             <button class="create-btn">Create</button>
                      </form> 
           </section>

    </div>
       <script src="chatBox.js"></script>
       <script src="https://messenger-axhs.onrender.com/socket.io/socket.io.js"></script>
</body>
</html>
