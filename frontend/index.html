<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat App</title>
  <link rel="stylesheet" href="style.css">
  <!-- Google Font: Poppins -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">

</head>
<body>
     <div class="wrapper">
          
           <section class="login-section hide" >  
            <div class="logo">Login</div>        
               <form class="login-form">
                  
                   <input type="email" placeholder="Email Address" id="login-email" >
                  
                  
                   <input type="password" placeholder="Password" id="login-password" >
                 
                   <button>Log In</button>
               </form>

               <div class="create-account">Create Account ?</div>
                <div class="forget-password">Forget Password ?</div>
           </section>
            
       <section class="signup-section ">
              <div class="logo">Sign Up</div>
       <form class="signup-form" >
             
                     <input type="text" placeholder="Full Name" id="user-name">
              

              
                       <input type="email" placeholder="Email Address" id="user-email">
              

              
                   <input type="password" placeholder="Password***" id="user-password">
           

         
                   <input type="password" placeholder="Confirm Password" id="user-confirmPassword">
             

              <button>Sign Up</button>            
           </form>

            <div class="already-account">Already have account ?</div>
            
           </section>

           <section class="forget-password-section hide ">
               <div class="logo">Forget Password</div>
               <form class="forget-email-form ">    
                 <input type="email" placeholder="enter your email" class="forget-email"/>
                 <button>send</button>
                </form> 
                <form class="set-new-password hide">
                     <input type="password" placeholder="new password" class="forget-newPass" />
                     <input type="password" placeholder="confirm password" class="forget-confirmPass"/>
                     <button>Save</button>
                </form>
                <form class="otp-form hide">
                       <input type="text" placeholder="enter otp" class="forget-otp"/>
                       <button>Submit</button>
                </form>
           </section>
      
     </div>
     <div class="loadder hide"><span class="loader"></span></div>

     <script src="script.js"></script>
</body>
</html>
